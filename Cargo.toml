[workspace]
resolver = "2"
members = [
    "apps/api",
]

[workspace.package]
edition = "2021"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
authors = ["Philipp Pahl <ph.pahl@gmail.com>"]
repository = "https://github.com/philipppahl/vozcoletiva"

[workspace.dependencies]
# Lambda runtime + HTTP integration.
lambda_http = "0.13"
lambda_runtime = "0.13"

# Async runtime.
tokio = { version = "1.41", features = ["macros", "rt"] }

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors.
thiserror = "1.0"

# AWS SDK + supporting libs.
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.62"

# JWT verification.
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio-sync = { package = "tokio", version = "1.41", features = ["sync"] }

# Misc.
once_cell = "1.20"
uuid = { version = "1.11", features = ["serde"] }
async-trait = "0.1"
rand = "0.8"
ulid = { version = "1.1", features = ["serde"] }
aws-sdk-scheduler = "1.65"
ammonia = "4.0"

# Real-time delivery (decisions 0028 + 0025 Phase B).
# - apigatewaymanagement: PostToConnection, to push messages to open WS clients.
# - ssm: read the VAPID private-key SecureString at cold start (never in env).
# - web-push-native: RFC 8291 payload encryption + VAPID, pure-Rust (RustCrypto)
#   so it cross-compiles to arm64 Lambda without a C toolchain.
aws-sdk-apigatewaymanagement = "1.100"
aws-sdk-ssm = "1.111"
web-push-native = "0.4"
# Decode base64url-unpadded subscription keys + the VAPID private scalar, and
# (standard base64) the avatar upload payload.
base64ct = { version = "1.8", features = ["alloc"] }
# Avatar object storage (decision 0029).
aws-sdk-s3 = "1.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
