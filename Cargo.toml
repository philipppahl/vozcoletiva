[workspace]
resolver = "2"
members = [
    "apps/api",
]

[workspace.package]
edition = "2021"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
authors = ["Philipp Pahl <ph.pahl@gmail.com>"]
repository = "https://github.com/philipppahl/vozcoletiva"

[workspace.dependencies]
# Lambda runtime + HTTP integration.
lambda_http = "0.13"
lambda_runtime = "0.13"

# Async runtime.
tokio = { version = "1.41", features = ["macros", "rt"] }

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors.
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
