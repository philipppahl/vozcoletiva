openapi: 3.1.0
info:
  title: vozcoletiva API
  version: 0.2.0
  description: |
    HTTP API for vozcoletiva. The projects slice adds project + membership +
    invite endpoints on top of the auth slice's /v1/me.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://dev.api.vozcoletiva.com
    description: Dev environment (default API Gateway URL until vozcoletiva.com is wired)
  - url: https://api.vozcoletiva.com
    description: Prod environment

paths:
  /v1/hello:
    get:
      summary: Healthcheck and version
      operationId: getHello
      tags: [meta]
      responses:
        '200':
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hello'

  /v1/me:
    get:
      summary: Current user profile
      operationId: getMe
      tags: [auth]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: display_name
          schema: { type: string, minLength: 1, maxLength: 80 }
          required: false
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: Missing, malformed, or expired access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects:
    get:
      summary: List the caller's projects
      operationId: listMyProjects
      tags: [projects]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: A list of projects with the caller's role on each.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '401':
          description: Missing or invalid auth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      summary: Create a project
      operationId: createProject
      tags: [projects]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectBody' }
      responses:
        '201':
          description: Project created. Caller is the Owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400':
          description: Invalid name / slug / template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Slug already taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}:
    get:
      summary: Get a project by slug
      operationId: getProject
      tags: [projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Project + caller's role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetailResponse' }
        '403':
          description: Not a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Project does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}/members:
    get:
      summary: List members of a project
      operationId: listMembers
      tags: [members]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Members of the project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/invites:
    get:
      summary: List a project's invites
      operationId: listInvites
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Invites for the project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Issue a new invite
      operationId: issueInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueInviteBody' }
      responses:
        '201':
          description: Invite created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/projects/{slug}/invites/{inviteId}:
    delete:
      summary: Revoke an invite
      operationId: revokeInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - in: path
          name: inviteId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invite revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/invites/{token}:
    get:
      summary: Preview an invite by URL token
      operationId: previewInviteByToken
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invite metadata + validity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/invites/by-code/{code}:
    get:
      summary: Preview an invite by short code
      operationId: previewInviteByCode
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invite metadata + validity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/proposals:
    get:
      summary: List proposals in a project
      operationId: listProposals
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Proposals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a proposal (Decision)
      operationId: createProposal
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProposalBody' }
      responses:
        '201':
          description: Proposal created and scheduled to close.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/projects/{slug}/proposals/{id}:
    get:
      summary: Get a proposal (with your current vote)
      operationId: getProposal
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Proposal detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/proposals/{id}/vote:
    post:
      summary: Cast or change a vote
      operationId: castVote
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CastVoteBody' }
      responses:
        '200':
          description: Vote recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Voting is closed or your previous vote changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      summary: Retract your current vote
      operationId: retractVote
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Vote retracted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No current vote to retract.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}/proposals/{id}/comments:
    get:
      summary: List comments on a proposal
      operationId: listComments
      tags: [comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Comments (chronological, including soft-deleted with body omitted).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Add a comment to a proposal
      operationId: createComment
      tags: [comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentBody' }
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/proposals/{id}/comments/{commentId}:
    patch:
      summary: Edit a comment (author only)
      operationId: updateComment
      tags: [comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
        - in: path
          name: commentId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCommentBody' }
      responses:
        '200':
          description: Comment updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Comment was deleted or changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      summary: Soft-delete a comment (author or admin)
      operationId: deleteComment
      tags: [comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
        - in: path
          name: commentId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Comment soft-deleted (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/proposals/{id}/withdraw:
    post:
      summary: Withdraw a proposal (author-only, before close)
      operationId: withdrawProposal
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Proposal withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Proposal is already closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/invites/by-code/{code}/accept:
    post:
      summary: Accept an invite by short code
      operationId: acceptInviteByCode
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Membership added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptInviteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invite revoked, expired, or used up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/invites/{token}/accept:
    post:
      summary: Accept an invite and become a project member
      operationId: acceptInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Membership added (or already present).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptInviteResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invite revoked, expired, or used up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token.

  parameters:
    Slug:
      in: path
      name: slug
      required: true
      schema: { type: string, minLength: 3, maxLength: 32 }
    ProposalId:
      in: path
      name: id
      required: true
      schema: { type: string }

  responses:
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    Hello:
      type: object
      required: [ok, version]
      additionalProperties: false
      properties:
        ok: { type: boolean, const: true }
        version: { type: string }

    Ok:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: boolean }

    ApiError:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error: { type: string }
        message: { type: string }

    UserProfile:
      type: object
      required: [user_id, display_name, locale, theme, created_at]
      additionalProperties: false
      properties:
        user_id: { type: string }
        display_name: { type: string }
        locale: { type: string, enum: [en, pt] }
        theme: { type: string, enum: [system, light, dark] }
        created_at: { type: string, format: date-time }

    Role:
      type: string
      enum: [owner, admin, moderator, member, observer]

    Project:
      type: object
      required: [id, slug, name, template, visibility, owner_id, created_at]
      additionalProperties: false
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        template: { type: string }
        visibility: { type: string, enum: [private, public] }
        owner_id: { type: string }
        created_at: { type: string, format: date-time }

    CreateProjectBody:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, minLength: 3, maxLength: 32, pattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$' }
        template:
          type: string
          enum: [custom]
          default: custom

    ProjectListEntry:
      type: object
      required: [project, role]
      additionalProperties: false
      properties:
        project: { $ref: '#/components/schemas/Project' }
        role: { $ref: '#/components/schemas/Role' }

    ProjectListResponse:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectListEntry' }

    ProjectDetailResponse:
      type: object
      required: [project, role]
      additionalProperties: false
      properties:
        project: { $ref: '#/components/schemas/Project' }
        role: { $ref: '#/components/schemas/Role' }

    Member:
      type: object
      required: [user_id, display_name, role, joined_at]
      additionalProperties: false
      properties:
        user_id: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        joined_at: { type: string, format: date-time }

    MemberListResponse:
      type: object
      required: [members]
      additionalProperties: false
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }

    IssueInviteBody:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }
        max_uses: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 200 }

    Invite:
      type: object
      required:
        [id, project_id, token, code, role, use_count, issued_by, issued_at]
      additionalProperties: false
      properties:
        id: { type: string }
        project_id: { type: string }
        token: { type: string }
        code: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        max_uses: { type: integer, nullable: true }
        use_count: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        issued_by: { type: string }
        issued_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }

    InviteListResponse:
      type: object
      required: [invites]
      additionalProperties: false
      properties:
        invites:
          type: array
          items: { $ref: '#/components/schemas/Invite' }

    InvitePreview:
      type: object
      required: [project_name, project_slug, role, use_count, revoked, valid]
      additionalProperties: false
      properties:
        project_name: { type: string }
        project_slug: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        expires_at: { type: string, format: date-time, nullable: true }
        use_count: { type: integer }
        max_uses: { type: integer, nullable: true }
        revoked: { type: boolean }
        valid: { type: boolean }

    VotingRule:
      type: string
      enum: [plurality, simple_majority, two_thirds, consensus]

    Choice:
      type: string
      description: >
        A vote in a deliberation: the picked alternative's proposal id, or the
        special token `__none__` ("none of these") or `__abstain__`.

    ProposalStatus:
      type: string
      enum: [voting, passed, rejected, quorum_failed, withdrawn]

    CreateProposalBody:
      type: object
      required: [title, body, voting_rule, ends_at]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 50000 }
        voting_rule: { $ref: '#/components/schemas/VotingRule' }
        quorum: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        ends_at: { type: string, format: date-time }

    CastVoteBody:
      type: object
      required: [choice]
      additionalProperties: false
      properties:
        choice: { $ref: '#/components/schemas/Choice' }

    Proposal:
      type: object
      required:
        - id
        - project_id
        - root_id
        - author_id
        - title
        - body
        - voting_rule
        - ends_at
        - status
        - tally_by_choice
        - tally_none
        - tally_abstain
        - tally_decisive
        - tally_total
        - created_at
      additionalProperties: false
      properties:
        id: { type: string }
        project_id: { type: string }
        root_id:
          type: string
          description: Root of this proposal's deliberation; equals `id` for a root.
        author_id: { type: string }
        title: { type: string }
        body: { type: string }
        voting_rule: { $ref: '#/components/schemas/VotingRule' }
        quorum: { type: integer, nullable: true }
        ends_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        tally_by_choice:
          type: object
          additionalProperties: { type: integer }
          description: proposalId → votes. For a plain decision the only key is the root id.
        tally_none: { type: integer, description: '"None of these" votes.' }
        tally_abstain: { type: integer }
        tally_decisive: { type: integer, description: Picks + none; abstain excluded. }
        tally_total: { type: integer, description: All voters, including abstainers. }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        your_choice: { $ref: '#/components/schemas/Choice', nullable: true }

    Comment:
      type: object
      required: [id, proposal_id, author_id, author_display_name, created_at]
      additionalProperties: false
      properties:
        id: { type: string }
        proposal_id: { type: string }
        author_id: { type: string }
        author_display_name: { type: string }
        body: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        deleted_by: { type: string, nullable: true }

    CommentListResponse:
      type: object
      required: [comments]
      additionalProperties: false
      properties:
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }

    CreateCommentBody:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    UpdateCommentBody:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    ProposalListResponse:
      type: object
      required: [proposals]
      additionalProperties: false
      properties:
        proposals:
          type: array
          items: { $ref: '#/components/schemas/Proposal' }

    AcceptInviteResponse:
      type: object
      required: [project, role]
      additionalProperties: false
      properties:
        project:
          type: object
          required: [id, slug, name]
          additionalProperties: false
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
