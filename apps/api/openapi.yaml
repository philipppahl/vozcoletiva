openapi: 3.1.0
info:
  title: vozcoletiva API
  version: 0.2.0
  description: |
    HTTP API for vozcoletiva. The projects slice adds project + membership +
    invite endpoints on top of the auth slice's /v1/me.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://dev.api.vozcoletiva.com
    description: Dev environment (default API Gateway URL until vozcoletiva.com is wired)
  - url: https://api.vozcoletiva.com
    description: Prod environment

paths:
  /v1/hello:
    get:
      summary: Healthcheck and version
      operationId: getHello
      tags: [meta]
      responses:
        '200':
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hello'

  /v1/me:
    get:
      summary: Current user profile
      operationId: getMe
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile (created on first call).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: Missing, malformed, or expired access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      summary: Update the caller's display name
      description: >
        Sets the caller's display name (upsert). Cognito holds auth only; this is
        the single bootstrap/edit path for the display name. The sign-up flow
        calls this once the account is confirmed.
      operationId: updateMe
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileBody' }
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400':
          description: Invalid display name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing, malformed, or expired access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/me/avatar:
    post:
      summary: Set the caller's avatar
      description: >
        Upload a profile photo. The client crops + resizes to ~256px WebP and
        sends the bytes as base64; the server re-validates type + size, stores
        it under an immutable versioned key, and returns the public URL.
      operationId: setAvatar
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarUploadBody' }
      responses:
        '200':
          description: Avatar stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarResponse' }
        '400':
          description: Not a valid image, too large, or bad base64.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing, malformed, or expired access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      summary: Remove the caller's avatar
      operationId: deleteAvatar
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Avatar removed (falls back to initials).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401':
          description: Missing, malformed, or expired access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/me/handle:
    put:
      summary: Set or change the caller's @handle
      description: >
        Claims a unique, case-insensitive @handle for the caller (used for
        mentions and as a public identifier). Releasing the previous handle and
        claiming the new one is atomic. Idempotent if the handle is unchanged.
      operationId: setHandle
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetHandleBody' }
      responses:
        '200':
          description: Handle claimed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetHandleResponse' }
        '400':
          description: Malformed or reserved handle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing, malformed, or expired access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Handle already taken by another user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/handles/{handle}/availability:
    get:
      summary: Check whether a handle is free to claim
      description: >
        Reports whether `handle` can be claimed. Auth-optional — the sign-up form
        checks before the account exists. When a valid token is present, the
        caller's own current handle reads as available (so the profile form does
        not flag a no-op save).
      operationId: getHandleAvailability
      tags: [auth]
      # Auth-optional: anonymous (sign-up) or authenticated (profile edit).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Availability of the handle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandleAvailability' }
        '400':
          description: Malformed or reserved handle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/uploads:
    post:
      summary: Get a presigned URL to upload chat media
      description: >
        Returns a short-lived presigned S3 PUT URL. The client uploads the bytes
        directly to S3 with the exact Content-Type, then posts a message
        referencing the returned `key`.
      operationId: createUpload
      tags: [messages]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '200':
          description: Presigned upload URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResponse' }
        '400':
          description: Unsupported content type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing, malformed, or expired access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/me/inbox:
    get:
      summary: The caller's inbox (notifications)
      operationId: listInbox
      tags: [inbox]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: before
          schema: { type: string }
          required: false
          description: Item id cursor — returns items older than it.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
          required: false
      responses:
        '200':
          description: Inbox items, newest-first, with the unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxListResponse' }
        '401':
          description: Missing or invalid auth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/me/inbox/{id}/read:
    post:
      summary: Mark one inbox item read
      operationId: markInboxItemRead
      tags: [inbox]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '404':
          description: No such item for this user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/me/inbox/read-all:
    post:
      summary: Mark all inbox items read
      operationId: markAllInboxRead
      tags: [inbox]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All marked read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /v1/me/push-subscriptions:
    post:
      summary: Register a Web Push subscription
      operationId: addPushSubscription
      tags: [push]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscribeBody' }
      responses:
        '201':
          description: Subscribed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /v1/me/push-subscriptions/remove:
    post:
      summary: Remove a Web Push subscription
      operationId: removePushSubscription
      tags: [push]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushUnsubscribeBody' }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /v1/me/notification-prefs:
    get:
      summary: Get notification preferences
      operationId: getNotificationPrefs
      tags: [push]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's notification preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
    put:
      summary: Update notification preferences
      operationId: putNotificationPrefs
      tags: [push]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPrefs' }
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }

  /v1/projects:
    get:
      summary: List the caller's projects
      operationId: listMyProjects
      tags: [projects]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: A list of projects with the caller's role on each.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '401':
          description: Missing or invalid auth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      summary: Create a project
      operationId: createProject
      tags: [projects]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectBody' }
      responses:
        '201':
          description: Project created. Caller is the Owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400':
          description: Invalid name / slug / template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Slug already taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}:
    get:
      summary: Get a project by slug
      operationId: getProject
      tags: [projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Project + caller's role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetailResponse' }
        '403':
          description: Not a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Project does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}/members:
    get:
      summary: List members of a project
      operationId: listMembers
      tags: [members]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Members of the project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/categories:
    get:
      summary: List categories (topics) in a project
      operationId: listCategories
      tags: [categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Categories, ordered by position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a category (owner/admin)
      operationId: createCategory
      tags: [categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryNameBody' }
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A category with that name already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}/categories/{id}:
    patch:
      summary: Rename a category (owner/admin)
      operationId: renameCategory
      tags: [categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryNameBody' }
      responses:
        '200':
          description: Category renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A category with that name already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      summary: Delete a category (owner/admin)
      operationId: deleteCategory
      tags: [categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Category still has proposals, or is the project's last.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}/documents:
    get:
      summary: List documents (derived from passed Document proposals)
      operationId: listDocuments
      tags: [documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Documents with their current version + active amendment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/documents/by-name/{name}:
    get:
      summary: Get a document by name (versions + current + active amendment)
      operationId: getDocumentByName
      tags: [documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/DocumentName'
      responses:
        '200':
          description: Document detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/invites:
    get:
      summary: List a project's invites
      operationId: listInvites
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Invites for the project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Issue a new invite
      operationId: issueInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueInviteBody' }
      responses:
        '201':
          description: Invite created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/projects/{slug}/invites/{inviteId}:
    delete:
      summary: Revoke an invite
      operationId: revokeInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - in: path
          name: inviteId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invite revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/invites/{token}:
    get:
      summary: Preview an invite by URL token
      operationId: previewInviteByToken
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invite metadata + validity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/invites/by-code/{code}:
    get:
      summary: Preview an invite by short code
      operationId: previewInviteByCode
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invite metadata + validity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/proposals:
    get:
      summary: List proposals in a project
      operationId: listProposals
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Proposals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a proposal (Decision), or a fork via parent_id
      operationId: createProposal
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProposalBody' }
      responses:
        '201':
          description: Proposal (or fork) created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Cannot fork a closed deliberation, or a document already has an active deliberation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}/proposals/{id}:
    get:
      summary: Get a proposal (with your current vote)
      operationId: getProposal
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Proposal detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/proposals/{id}/tree:
    get:
      summary: Get the deliberation tree (root + forks)
      operationId: getProposalTree
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: >
            Flat deliberation tree, created-ordered. Each node carries the
            deliberation (root) tally; the client rebuilds nesting from
            `parent_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/proposals/{id}/vote:
    post:
      summary: Cast or change a vote
      operationId: castVote
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CastVoteBody' }
      responses:
        '200':
          description: Vote recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Voting is closed or your previous vote changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      summary: Retract your current vote
      operationId: retractVote
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Vote retracted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No current vote to retract.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}/proposals/{id}/comments:
    get:
      summary: List comments on a proposal
      operationId: listComments
      tags: [comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Comments (chronological, including soft-deleted with body omitted).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Add a comment to a proposal
      operationId: createComment
      tags: [comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentBody' }
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/proposals/{id}/comments/{commentId}:
    patch:
      summary: Edit a comment (author only)
      operationId: updateComment
      tags: [comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
        - in: path
          name: commentId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCommentBody' }
      responses:
        '200':
          description: Comment updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Comment was deleted or changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      summary: Soft-delete a comment (author or admin)
      operationId: deleteComment
      tags: [comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
        - in: path
          name: commentId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Comment soft-deleted (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/proposals/{id}/withdraw:
    post:
      summary: Withdraw a proposal (author-only, before close)
      operationId: withdrawProposal
      tags: [proposals]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Proposal withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Proposal is already closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/invites/by-code/{code}/accept:
    post:
      summary: Accept an invite by short code
      operationId: acceptInviteByCode
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Membership added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptInviteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invite revoked, expired, or used up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/invites/{token}/accept:
    post:
      summary: Accept an invite and become a project member
      operationId: acceptInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Membership added (or already present).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptInviteResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invite revoked, expired, or used up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/projects/{slug}/channels:
    get:
      summary: List a project's channels
      operationId: listChannels
      tags: [messaging]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Channels with unread counts + last-message previews.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{slug}/search:
    get:
      summary: Search a project (proposals, documents, members, channels)
      operationId: searchProject
      tags: [projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Query string; under 2 chars returns empty sections.
      responses:
        '200':
          description: Grouped search hits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/conversations/{id}:
    get:
      summary: Get a conversation
      operationId: getConversation
      tags: [messaging]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation — a channel or a DM, discriminated by `kind`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Channel' }
                  - { $ref: '#/components/schemas/DmConversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dms:
    get:
      summary: List the caller's direct messages
      operationId: listDms
      tags: [messaging]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's DMs across all projects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DmListResponse' }
        '401':
          description: Missing or invalid auth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      summary: Start (or get) a direct message with another user
      description: >
        Idempotent per user pair — the same two users always resolve to the same
        conversation. The peer must be an existing user.
      operationId: startDm
      tags: [messaging]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartDmBody' }
      responses:
        '200':
          description: The (new or existing) DM conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DmConversation' }
        '400':
          description: Cannot DM yourself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Peer user does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /v1/conversations/{id}/messages:
    get:
      summary: List top-level messages (newest-first, cursor)
      operationId: listMessages
      tags: [messaging]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - in: query
          name: before
          required: false
          description: Return messages older than this message id.
          schema: { type: string }
      responses:
        '200':
          description: Messages page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Post a message (a reply quotes another via reply_to_id)
      operationId: postMessage
      tags: [messaging]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostMessageBody' }
      responses:
        '201':
          description: Message posted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/conversations/{id}/read:
    post:
      summary: Advance the conversation read marker
      operationId: markConversationRead
      tags: [messaging]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadBody' }
      responses:
        '200':
          description: Marker advanced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/messages/{id}/thread:
    get:
      summary: Get a thread (parent + replies)
      operationId: getThread
      tags: [messaging]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token.

  parameters:
    Slug:
      in: path
      name: slug
      required: true
      schema: { type: string, minLength: 3, maxLength: 32 }
    ProposalId:
      in: path
      name: id
      required: true
      schema: { type: string }

    CategoryId:
      in: path
      name: id
      required: true
      schema: { type: string }

    DocumentName:
      in: path
      name: name
      required: true
      description: Document name (percent-encoded).
      schema: { type: string }

    ConversationId:
      in: path
      name: id
      required: true
      schema: { type: string }

    MessageId:
      in: path
      name: id
      required: true
      schema: { type: string }

  responses:
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    Hello:
      type: object
      required: [ok, version]
      additionalProperties: false
      properties:
        ok: { type: boolean, const: true }
        version: { type: string }

    Ok:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: boolean }

    LastMessagePreview:
      type: object
      required: [author_display_name, body_preview, at]
      additionalProperties: false
      properties:
        author_display_name: { type: string }
        body_preview: { type: string }
        at: { type: string, format: date-time }

    Channel:
      type: object
      required: [kind, id, project_id, name, member_count, unread_count]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [channel] }
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        member_count: { type: integer }
        last_message:
          oneOf: [{ $ref: '#/components/schemas/LastMessagePreview' }]
          nullable: true
        unread_count: { type: integer }

    ChannelListResponse:
      type: object
      required: [channels]
      additionalProperties: false
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }

    DmParticipant:
      type: object
      required: [user_id, display_name]
      additionalProperties: false
      properties:
        user_id: { type: string }
        display_name: { type: string }
        handle: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }

    DmConversation:
      type: object
      required: [kind, id, participants, unread_count]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [dm] }
        id: { type: string }
        participants:
          type: array
          items: { $ref: '#/components/schemas/DmParticipant' }
        last_message:
          oneOf: [{ $ref: '#/components/schemas/LastMessagePreview' }]
          nullable: true
        unread_count: { type: integer }

    DmListResponse:
      type: object
      required: [dms]
      additionalProperties: false
      properties:
        dms:
          type: array
          items: { $ref: '#/components/schemas/DmConversation' }

    StartDmBody:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string }

    Message:
      type: object
      required:
        - id
        - conversation_id
        - author_id
        - author_display_name
        - body
        - attachments
        - created_at
        - reply_count
      additionalProperties: false
      properties:
        id: { type: string }
        conversation_id: { type: string }
        reply_to:
          oneOf: [{ $ref: '#/components/schemas/ReplyTo' }]
          nullable: true
        author_id: { type: string }
        author_display_name: { type: string }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        reply_count: { type: integer }
        last_reply_at: { type: string, format: date-time, nullable: true }

    ReplyTo:
      type: object
      description: An immutable snapshot of the quoted message (decision 0031).
      required: [id, author_display_name, preview, kind]
      additionalProperties: false
      properties:
        id: { type: string }
        author_display_name: { type: string }
        preview: { type: string }
        kind: { type: string, enum: [text, image, doc, voice] }

    MessageListResponse:
      type: object
      required: [messages, has_more]
      additionalProperties: false
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        has_more: { type: boolean }

    ThreadResponse:
      type: object
      required: [parent, replies]
      additionalProperties: false
      properties:
        parent: { $ref: '#/components/schemas/Message' }
        replies:
          type: array
          items: { $ref: '#/components/schemas/Message' }

    PostMessageBody:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 0, maxLength: 4000 }
        reply_to_id: { type: string, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentInput' }

    Attachment:
      type: object
      required: [kind, url, mime]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [image, doc, voice] }
        url: { type: string }
        mime: { type: string }
        name: { type: string }
        size: { type: integer }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer }

    AttachmentInput:
      type: object
      required: [kind, key]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [image, doc, voice] }
        key: { type: string }
        mime: { type: string }
        name: { type: string }
        size: { type: integer }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer }

    UploadRequest:
      type: object
      required: [content_type, ext]
      additionalProperties: false
      properties:
        content_type: { type: string }
        ext: { type: string }

    UploadResponse:
      type: object
      required: [put_url, key, url]
      additionalProperties: false
      properties:
        put_url: { type: string, description: Presigned S3 PUT URL (short-lived). }
        key: { type: string }
        url: { type: string, description: Public CDN URL once uploaded. }

    ReadBody:
      type: object
      required: [message_id]
      additionalProperties: false
      properties:
        message_id: { type: string }

    ApiError:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error: { type: string }
        message: { type: string }

    UserProfile:
      type: object
      required: [user_id, display_name, locale, theme, created_at]
      additionalProperties: false
      properties:
        user_id: { type: string }
        display_name: { type: string }
        handle: { type: string, nullable: true }
        locale: { type: string, enum: [en, pt] }
        theme: { type: string, enum: [system, light, dark] }
        created_at: { type: string, format: date-time }
        avatar_url: { type: string, nullable: true }

    SetHandleBody:
      type: object
      required: [handle]
      additionalProperties: false
      properties:
        handle: { type: string, minLength: 3, maxLength: 20 }

    SetHandleResponse:
      type: object
      required: [handle]
      additionalProperties: false
      properties:
        handle: { type: string }

    HandleAvailability:
      type: object
      required: [handle, available]
      additionalProperties: false
      properties:
        handle: { type: string }
        available: { type: boolean }

    UpdateProfileBody:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80 }

    AvatarUploadBody:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: string
          description: Standard base64 of the image bytes (PNG/JPEG/WebP, ≤512 KB decoded).

    AvatarResponse:
      type: object
      required: [avatar_url]
      additionalProperties: false
      properties:
        avatar_url: { type: string }

    InboxItem:
      type: object
      required:
        [id, kind, project_id, project_slug, project_name, actor_id, preview, created_at]
      additionalProperties: false
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [mention, reply, comment-on-yours, proposal-closed, document-amended]
        project_id: { type: string }
        project_slug: { type: string }
        project_name: { type: string }
        actor_id: { type: string }
        actor_display_name: { type: string, nullable: true }
        proposal_id: { type: string, nullable: true }
        comment_id: { type: string, nullable: true }
        conversation_id: { type: string, nullable: true }
        message_id: { type: string, nullable: true }
        document_name: { type: string, nullable: true }
        preview: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }

    InboxListResponse:
      type: object
      required: [items, unread_count]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InboxItem' }
        unread_count: { type: integer }

    PushSubscribeBody:
      type: object
      required: [endpoint, keys]
      additionalProperties: false
      properties:
        endpoint: { type: string }
        keys:
          type: object
          required: [p256dh, auth]
          additionalProperties: false
          properties:
            p256dh: { type: string }
            auth: { type: string }

    PushUnsubscribeBody:
      type: object
      required: [endpoint]
      additionalProperties: false
      properties:
        endpoint: { type: string }

    NotificationPrefs:
      type: object
      required:
        [push_enabled, mention, reply, comment_on_yours, proposal_closed, document_amended, direct_message]
      additionalProperties: false
      properties:
        push_enabled: { type: boolean }
        mention: { type: boolean }
        reply: { type: boolean }
        comment_on_yours: { type: boolean }
        proposal_closed: { type: boolean }
        document_amended: { type: boolean }
        # Gates the realtime DM push (decision 0028). Not an inbox kind.
        direct_message: { type: boolean }

    ProposalSearchHit:
      type: object
      required: [id, title, snippet, status, proposal_kind]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        snippet: { type: string }
        status: { type: string, enum: [voting, passed, rejected, quorum_failed, withdrawn] }
        proposal_kind: { type: string, enum: [decision, document] }

    DocumentSearchHit:
      type: object
      required: [name, version_count, snippet]
      additionalProperties: false
      properties:
        name: { type: string }
        version_count: { type: integer }
        snippet: { type: string }

    MemberSearchHit:
      type: object
      required: [user_id, display_name, role]
      additionalProperties: false
      properties:
        user_id: { type: string }
        display_name: { type: string }
        role: { type: string }

    ChannelSearchHit:
      type: object
      required: [id, name, description]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }

    SearchResponse:
      type: object
      required: [query, sections]
      additionalProperties: false
      properties:
        query: { type: string }
        sections:
          type: object
          required: [proposals, documents, members, channels]
          additionalProperties: false
          properties:
            proposals:
              type: object
              required: [hits, has_more]
              additionalProperties: false
              properties:
                hits: { type: array, items: { $ref: '#/components/schemas/ProposalSearchHit' } }
                has_more: { type: boolean }
            documents:
              type: object
              required: [hits, has_more]
              additionalProperties: false
              properties:
                hits: { type: array, items: { $ref: '#/components/schemas/DocumentSearchHit' } }
                has_more: { type: boolean }
            members:
              type: object
              required: [hits, has_more]
              additionalProperties: false
              properties:
                hits: { type: array, items: { $ref: '#/components/schemas/MemberSearchHit' } }
                has_more: { type: boolean }
            channels:
              type: object
              required: [hits, has_more]
              additionalProperties: false
              properties:
                hits: { type: array, items: { $ref: '#/components/schemas/ChannelSearchHit' } }
                has_more: { type: boolean }

    Role:
      type: string
      enum: [owner, admin, moderator, member, observer]

    Project:
      type: object
      required: [id, slug, name, template, visibility, owner_id, created_at]
      additionalProperties: false
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        template: { type: string }
        visibility: { type: string, enum: [private, public] }
        owner_id: { type: string }
        created_at: { type: string, format: date-time }

    CreateProjectBody:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, minLength: 3, maxLength: 32, pattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$' }
        template:
          type: string
          enum: [custom]
          default: custom

    ProjectListEntry:
      type: object
      required: [project, role]
      additionalProperties: false
      properties:
        project: { $ref: '#/components/schemas/Project' }
        role: { $ref: '#/components/schemas/Role' }

    ProjectListResponse:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectListEntry' }

    ProjectDetailResponse:
      type: object
      required: [project, role]
      additionalProperties: false
      properties:
        project: { $ref: '#/components/schemas/Project' }
        role: { $ref: '#/components/schemas/Role' }

    Member:
      type: object
      required: [user_id, display_name, role, joined_at]
      additionalProperties: false
      properties:
        user_id: { type: string }
        display_name: { type: string }
        handle: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        joined_at: { type: string, format: date-time }
        avatar_url: { type: string, nullable: true }

    MemberListResponse:
      type: object
      required: [members]
      additionalProperties: false
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }

    Category:
      type: object
      required: [id, name, position]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        position: { type: integer }

    CategoryListResponse:
      type: object
      required: [categories]
      additionalProperties: false
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    CategoryNameBody:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }

    DocumentSummary:
      type: object
      required: [name, version_count]
      additionalProperties: false
      properties:
        name: { type: string }
        version_count: { type: integer }
        current_version:
          oneOf: [{ $ref: '#/components/schemas/Proposal' }]
          nullable: true
        active_amendment:
          oneOf: [{ $ref: '#/components/schemas/Proposal' }]
          nullable: true

    DocumentListResponse:
      type: object
      required: [documents]
      additionalProperties: false
      properties:
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocumentSummary' }

    DocumentDetail:
      type: object
      required: [name, version_count, current_version, versions]
      additionalProperties: false
      properties:
        name: { type: string }
        version_count: { type: integer }
        current_version: { $ref: '#/components/schemas/Proposal' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/Proposal' }
        active_amendment:
          oneOf: [{ $ref: '#/components/schemas/Proposal' }]
          nullable: true

    IssueInviteBody:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }
        max_uses: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 200 }

    Invite:
      type: object
      required:
        [id, project_id, token, code, role, use_count, issued_by, issued_at]
      additionalProperties: false
      properties:
        id: { type: string }
        project_id: { type: string }
        token: { type: string }
        code: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        max_uses: { type: integer, nullable: true }
        use_count: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        issued_by: { type: string }
        issued_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }

    InviteListResponse:
      type: object
      required: [invites]
      additionalProperties: false
      properties:
        invites:
          type: array
          items: { $ref: '#/components/schemas/Invite' }

    InvitePreview:
      type: object
      required: [project_name, project_slug, role, use_count, revoked, valid]
      additionalProperties: false
      properties:
        project_name: { type: string }
        project_slug: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        expires_at: { type: string, format: date-time, nullable: true }
        use_count: { type: integer }
        max_uses: { type: integer, nullable: true }
        revoked: { type: boolean }
        valid: { type: boolean }

    VotingRule:
      type: string
      enum: [plurality, simple_majority, two_thirds, consensus]

    ProposalKind:
      type: string
      enum: [decision, document]

    Choice:
      type: string
      description: >
        A vote in a deliberation: the picked alternative's proposal id, or the
        special token `__none__` ("none of these") or `__abstain__`.

    ProposalStatus:
      type: string
      enum: [voting, passed, rejected, quorum_failed, withdrawn]

    CreateProposalBody:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 50000 }
        voting_rule:
          allOf: [{ $ref: '#/components/schemas/VotingRule' }]
          description: Required for a root; inherited from the root for a fork.
        quorum: { type: integer, minimum: 1, maximum: 100000, nullable: true }
        ends_at:
          type: string
          format: date-time
          description: Required for a root; inherited for a fork.
        parent_id:
          type: string
          nullable: true
          description: When set, creates a fork under this parent's deliberation.
        category_id:
          type: string
          nullable: true
          description: Category (topic) for a root; defaults to the project's first. Ignored for a fork.
        proposal_kind:
          allOf: [{ $ref: '#/components/schemas/ProposalKind' }]
          description: '`decision` (default) or `document`. Root only; forks inherit.'
        document_name:
          type: string
          nullable: true
          description: Required for a `document` root — the stable document name.
        options:
          type: array
          nullable: true
          items: { type: string }
          description: >
            2+ labels turn a brand-new Decision into a multi-option vote (the
            proposal becomes the non-votable question, each label a child option).
            1 label is rejected; 0/absent is a plain yes/no decision.

    CastVoteBody:
      type: object
      required: [choice]
      additionalProperties: false
      properties:
        choice: { $ref: '#/components/schemas/Choice' }

    Proposal:
      type: object
      required:
        - id
        - project_id
        - root_id
        - category_id
        - proposal_kind
        - is_question
        - author_id
        - title
        - body
        - voting_rule
        - ends_at
        - status
        - tally_by_choice
        - tally_none
        - tally_abstain
        - tally_decisive
        - tally_total
        - created_at
      additionalProperties: false
      properties:
        id: { type: string }
        project_id: { type: string }
        root_id:
          type: string
          description: Root of this proposal's deliberation; equals `id` for a root.
        parent_id:
          type: string
          nullable: true
          description: Parent proposal id for a fork; null for a root.
        category_id:
          type: string
          description: Project-scoped category (topic) id.
        proposal_kind: { $ref: '#/components/schemas/ProposalKind' }
        document_name:
          type: string
          nullable: true
          description: Set on Document-kind proposals — the document this is a version of.
        is_question:
          type: boolean
          description: True on a multi-option decision's question root — not itself votable.
        author_id: { type: string }
        title: { type: string }
        body: { type: string }
        voting_rule: { $ref: '#/components/schemas/VotingRule' }
        quorum: { type: integer, nullable: true }
        ends_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        tally_by_choice:
          type: object
          additionalProperties: { type: integer }
          description: proposalId → votes. For a plain decision the only key is the root id.
        tally_none: { type: integer, description: '"None of these" votes.' }
        tally_abstain: { type: integer }
        tally_decisive: { type: integer, description: Picks + none; abstain excluded. }
        tally_total: { type: integer, description: All voters, including abstainers. }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        your_choice: { $ref: '#/components/schemas/Choice', nullable: true }

    Comment:
      type: object
      required: [id, proposal_id, author_id, author_display_name, created_at]
      additionalProperties: false
      properties:
        id: { type: string }
        proposal_id: { type: string }
        author_id: { type: string }
        author_display_name: { type: string }
        body: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        deleted_by: { type: string, nullable: true }

    CommentListResponse:
      type: object
      required: [comments]
      additionalProperties: false
      properties:
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }

    CreateCommentBody:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    UpdateCommentBody:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    ProposalListResponse:
      type: object
      required: [proposals]
      additionalProperties: false
      properties:
        proposals:
          type: array
          items: { $ref: '#/components/schemas/Proposal' }

    AcceptInviteResponse:
      type: object
      required: [project, role]
      additionalProperties: false
      properties:
        project:
          type: object
          required: [id, slug, name]
          additionalProperties: false
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
