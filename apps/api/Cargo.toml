[package]
name = "voz-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "voz_api"
path = "src/lib.rs"

[[bin]]
name = "voz-api"
path = "src/main.rs"

[[bin]]
name = "voz-worker"
path = "src/bin/worker.rs"

[features]
# Exposes test-only constructors (AppState::for_test, JwtVerifier::stub) used by
# the DynamoDB-Local integration tests in `tests/`. Off in normal builds.
test-support = []

[dependencies]
lambda_http = { workspace = true }
lambda_runtime = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-scheduler = { workspace = true }
ammonia = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
once_cell = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
