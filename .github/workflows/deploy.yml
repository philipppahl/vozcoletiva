name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy → dev (stage 4)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93
          targets: aarch64-unknown-linux-musl

      - name: Install cargo-lambda
        run: |
          curl -fsSL https://github.com/cargo-lambda/cargo-lambda/releases/latest/download/cargo-lambda-v1.6.0.x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C ~/.cargo/bin/

      - name: bun install
        run: bun install --frozen-lockfile

      # TODO(repo): once the GH repo exists, set this secret to an IAM role
      # ARN whose trust policy is restricted to this repo+branch via OIDC.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
          aws-region: eu-west-1

      - name: Deploy dev
        run: bun run deploy --env dev

  deploy-prod:
    name: Deploy → prod (stage 5)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93
          targets: aarch64-unknown-linux-musl

      - name: Install cargo-lambda
        run: |
          curl -fsSL https://github.com/cargo-lambda/cargo-lambda/releases/latest/download/cargo-lambda-v1.6.0.x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C ~/.cargo/bin/

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: eu-west-1

      - name: Deploy prod
        run: bun run deploy --env prod
